services:
  # Caddy: TLS (automatic HTTPS, HTTP/3) and routing for p.infosecstreams.com.
  # Replaces nginx + certbot. Config: ./caddy/Caddyfile.
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: security.txt@infosecstreams.com
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # streamstatus to receive event requests from twitch
  streamstatus:
    # Pinned to a signed digest by ./deploy-streamstatus (via .env); :latest only as a fallback.
    image: ${STREAMSTATUS_IMAGE:-ghcr.io/infosecstreams/streamstatus:latest}
    env_file: streamstatus.env
    restart: always
    environment:
      # Live state, stream history and stats (SQLite, WAL mode).
      SS_DB_PATH: /data/streamstatus.db
    volumes:
      - streamstatus-data:/data
      - ./secrets:/run/secrets:ro
    ports:
      # Loopback only: the deploy script's health check. Caddy reaches the bot over the compose network.
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - caddy

  # plausibles main database
  plausible_db:
    # PG18, what upstream CI tests at v3.2.1
    image: postgres:18-alpine
    restart: always
    volumes:
      # 18+ images keep PGDATA under /var/lib/postgresql/18/docker
      - db-data-pg18:/var/lib/postgresql
    env_file:
      - postgres-conf.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 1m

  # plausibles event database
  plausible_events_db:
    image: clickhouse/clickhouse-server:25.11.9.34-alpine
    # 25.x caps itself at 90% of this; ~250 MiB is used at idle
    mem_limit: 512m
    restart: always
    environment:
      # keep network access for the passwordless default user Plausible uses
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - event-data:/var/lib/clickhouse
      - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
      nproc: 30000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      start_period: 1m

  # plausible analytics
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.2
    mem_limit: 700m
    memswap_limit: 700m
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
      caddy:
        condition: service_started
    volumes:
      - plausible-data:/var/lib/plausible
    environment:
      - TMPDIR=/var/lib/plausible/tmp
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    env_file:
      - plausible-conf.env

# Our local docker volumes
volumes:
  caddy-data:
  caddy-config:
  streamstatus-data:
  db-data-pg18:
    driver: local
  event-data:
    driver: local
  plausible-data:
    driver: local

 # For detailed migration instructions
 # that were tested via trial by fire
 # check: https://github.com/plausible/analytics/discussions/1911#discussioncomment-5894441
