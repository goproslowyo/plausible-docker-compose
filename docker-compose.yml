services:
  # nginx to front plausible, letencrypt renewals, and streamstatus.
  nginx:
    # We build a custom nginx container from alpine with a proper nginx.conf
    build:
      context: ./nginx
      dockerfile: nginx.Dockerfile
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    user: root:root
    volumes:
      - ./nginx/config:/config
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - acme-challenge:/tmp/acme_challenge
      - /home/ec2-user/backspin:/var/www/backspin:ro
    restart: always
    depends_on:
      - letsencrypt

  # letencrypt to check and regenerate certs.
  letsencrypt:
    image: certbot/certbot:latest
    command: sh -c "while :; do certbot renew --debug -v; R=$$(( ( RANDOM % 604800 )  + 259200 )); echo sleeping $$R seconds...; sleep $$R; done"
    #command: sh -c "certbot certonly --debug --webroot -w /tmp/acme_challenge --expand -d p.infosecstreams.com --text --agree-tos --register-unsafely-without-email --rsa-key-size 4096 --verbose --preferred-challenges=http"
    #command: sh -c "certbot certonly --staging --debug --webroot -w /tmp/acme_challenge --expand -d p.infosecstreams.com --text --agree-tos --register-unsafely-without-email --rsa-key-size 4096 --verbose --preferred-challenges=http"
    entrypoint: ""
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - acme-challenge:/tmp/acme_challenge
    environment:
      - TERM=xterm
    restart: unless-stopped

  # streamstatus to receive event requests from twitch
  streamstatus:
    image: ghcr.io/infosecstreams/streamstatus:latest
    env_file: streamstatus.env
    restart: always
    depends_on:
      - nginx

  # plausibles main database
  plausible_db:
    # PG18, what upstream CI tests at v3.2.1
    image: postgres:18-alpine
    restart: always
    volumes:
      # 18+ images keep PGDATA under /var/lib/postgresql/18/docker
      - db-data-pg18:/var/lib/postgresql
    env_file:
      - postgres-conf.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 1m

  # plausibles event database
  plausible_events_db:
    image: clickhouse/clickhouse-server:25.11.9.34-alpine
    # 25.x caps itself at 90% of this; ~250 MiB is used at idle
    mem_limit: 512m
    restart: always
    environment:
      # keep network access for the passwordless default user Plausible uses
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - event-data:/var/lib/clickhouse
      - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
      nproc: 30000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      start_period: 1m

  # plausible analytics
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.2
    mem_limit: 700m
    memswap_limit: 700m
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
      nginx:
        condition: service_started
    volumes:
      - plausible-data:/var/lib/plausible
    environment:
      - TMPDIR=/var/lib/plausible/tmp
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    env_file:
      - plausible-conf.env

# Our local docker volumes
volumes:
  acme-challenge:
  db-data-pg18:
    driver: local
  event-data:
    driver: local
  plausible-data:
    driver: local

 # For detailed migration instructions
 # that were tested via trial by fire
 # check: https://github.com/plausible/analytics/discussions/1911#discussioncomment-5894441
