map $http_user_agent $block_ua {
    default 0;
    # infra/attack-surface scanners
    "~*CensysInspect|Expanse|leakix|Keydrop|onlyscans|Palo Alto Networks|visionheight" 1;
    "~*zgrab|GenomeCrawlerd|FlowIQLabsBot|forestengine\.net|InternetMeasurement" 1;
    "~*getdomaindata|ArgusScanner|ModatScanner|osentix|net-research-scan|YisouSpider" 1;
    "~*SiteLockSpider" 1;
    # SEO/AI crawlers — nothing to index here
    "~*bingbot|Amazonbot|AhrefsBot|OAI-SearchBot|GPTBot|ClaudeBot|Bytespider|PetalBot|SemrushBot|DotBot|MJ12bot|AgentReadinessScanner" 1;
    # stale scanner UA, GET / floods from cloud IPs
    "~iPhone OS 13_2_3" 1;
    # long-dead browsers, scanner-only
    "~MSIE [6-9]\.|Trident/[4-6]\.|Chrome/4[0-9]\.0\." 1;   
    # null UA
    "" 1;
}

map $request_uri $block_path {
    default 0;
    "~*^/(wp-|wordpress|xmlrpc\.php)" 1;
    "~*wp-includes|wp-content|wp-admin" 1;
    "~*^/\.env" 1;
    "~*^/\.git" 1;
    "~*^/cgi-bin/" 1;
    "~*setDebugCfg" 1;
    "~*^/(vpn|manage/account|admin/index\.html)" 1;
    # drop the ^/ anchors on the vuln signatures
    "~*actuator|/CFIDE/|geoserver|LoginForm\.jsp|/console/login|\.jsp(\?|$)|\.php(\?|$)" 1;
}
