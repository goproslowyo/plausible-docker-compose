map $http_user_agent $block_ua {
    default 0;
    "~*CensysInspect|Expanse|leakix|Keydrop|onlyscans|Palo Alto Networks|visionheight" 1;
    "~*zgrab|GenomeCrawlerd|FlowIQLabsBot|forestengine\.net|InternetMeasurement" 1;
    "~iPhone OS 13_2_3" 1;   # stale scanner UA, GET / floods from cloud IPs
    "" 1;                    # null UA
}

map $request_uri $block_path {
    default 0;
    "~*^/(wp-|wordpress|xmlrpc\.php)" 1;
    "~*wp-includes|wp-content|wp-admin" 1;
    "~*^/\.env" 1;
    "~*^/\.git" 1;
    "~*^/cgi-bin/" 1;
    "~*setDebugCfg" 1;
    "~*^/(vpn|manage/account|admin/index\.html)" 1;
}
